[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "heapwise"
version = "0.1.1"
description = "A Python memory profiler that tells you what is using your memory, and why it is still alive."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Thomas Chardonnens" }]
keywords = ["memory", "profiler", "profiling", "heap", "leak", "allocations"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Software Development :: Debuggers",
]

[project.urls]
Homepage = "https://github.com/tchardonnens/heapwise"
Issues = "https://github.com/tchardonnens/heapwise/issues"

[project.scripts]
heapwise = "heapwise.cli:main"

[project.entry-points.pytest11]
heapwise = "heapwise.pytest_plugin"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.maturin]
python-source = "python"
module-name = "heapwise._native"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
